<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Techno-juggling</title>
  
  <!-- Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- CodeMirror 5 (same as Hydra uses) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/tomorrow-night-eighties.min.css">
  <link rel="stylesheet" href="./styles/loading.css">
  <link rel="stylesheet" href="./styles/live-code-editor.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/selection/active-line.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

</head>
<body>
  <!-- Loading screen -->
  <div id="loadingOverlay">
    <div class="loading-text">Techno-juggling</div>
    <div class="loading-status" id="loadingStatus">Connecting to server...</div>
    
    <!-- Calibration buttons (shown when server asks for choice) -->
    <div class="calibration-buttons" id="calibrationButtons">
      <button class="calibration-btn primary" id="useLast">
        Use Last Settings
        <br><small>Quick start</small>
      </button>
      <button class="calibration-btn" id="calibrateNow">
        Calibrate Now
        <br><small>Adjust camera & balls</small>
      </button>
    </div>
  </div>
  
  <!-- 3D rendering container -->
  <div id="webgl-container"></div>
  
  <!-- Code editor container -->
  <div id="code-editor"></div>
  
  <!-- Import modular JavaScript -->
  <script type="module" src="./core/main.js"></script>
</body>
</html>
