<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Techno-juggling</title>
  
  <!-- Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- CodeMirror 5 (same as Hydra uses) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/tomorrow-night-eighties.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/selection/active-line.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
    }
    
    /* 3D rendering container */
    #webgl-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    
    /* Loading screen */
    #loadingOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.5s;
    }
    
    #loadingOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .loading-text {
      font-size: 48px;
      color: #fff;
      letter-spacing: 0.2em;
      margin-bottom: 40px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .loading-status {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 30px;
      text-align: center;
      line-height: 1.6;
    }
    
    .loading-status.error {
      color: #ff4444;
    }
    
    /* Calibration buttons */
    .calibration-buttons {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .calibration-buttons.show {
      opacity: 1;
    }
    
    .calibration-btn {
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 15px 30px;
      font-size: 16px;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s;
      min-width: 200px;
    }
    
    .calibration-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.8);
      transform: translateY(-2px);
    }
    
    .calibration-btn:active {
      transform: translateY(0);
    }
    
    .calibration-btn.primary {
      border-color: #00ff00;
      color: #00ff00;
    }
    
    .calibration-btn.primary:hover {
      background: rgba(0, 255, 0, 0.1);
      border-color: #00ff00;
    }
    
    .calibration-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    /* Code editor container - transparent overlay, full screen */
    #code-editor {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      pointer-events: auto;
    }
  
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loadingOverlay">
    <div class="loading-text">Techno-juggling</div>
    <div class="loading-status" id="loadingStatus">Connecting to server...</div>
    
    <!-- Calibration buttons (shown when server asks for choice) -->
    <div class="calibration-buttons" id="calibrationButtons">
      <button class="calibration-btn primary" id="useLast">
        Use Last Settings
        <br><small>Quick start</small>
      </button>
      <button class="calibration-btn" id="calibrateNow">
        Calibrate Now
        <br><small>Adjust camera & balls</small>
      </button>
    </div>
  </div>
  
  <!-- 3D rendering container -->
  <div id="webgl-container"></div>
  
  <!-- Code editor container -->
  <div id="code-editor" data-initial-code='{
  clips: {
    A: {url: "hackers.png", start: 0, end: 10},
    B: {url: "frog-scream.png", start: 0, end: 10},
    C: {url: "hackers2.png", start: 0, end: 10},
  },

  presets: {
  },
  
  streams: {
    streamA: "A{scale: 10, useMask: 1, maskShape: circle, maskRadius: .5}",
    streamB: "B{scale: 10, useMask: 1, maskShape: triangle, maskRadius: .5}",
    streamC: "C{scale: 10, useMask: 1, maskShape: circle, maskRadius: .5}",
  },
  
  routing: {
    ball_0: {stream: "streamA", offset: 0},
    ball_1: {stream: "streamB", offset: 0},
    ball_2: {stream: "streamC", offset: 0},
  },
  
  ballConnections: {
    enabled: true,
    mode: "mesh",
    lineWidth: 0.08,
    opacity: 0.4,
    color: 0x00ffff,
    zIndex: 0.05
  },
  ballTrails: {
    enabled: true,
    count: 5,
    maxDelay: .3,
    radiusRange: [.5, 2],
    sides: 5,
    perBallColors: true,
    ballColors: {
      0: [0xff0000],  
      1: [0x00ff00],  
      2: [0xffff00],   
    }
  },
  showCamera: true
}'></div>
  
  <!-- Import modular JavaScript -->
  <script type="module" src="./core/main.js"></script>
</body>
</html>
