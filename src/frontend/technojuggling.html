<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tell-A-Vision</title>
  
  <!-- Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
    }
    
    /* 3D rendering containers */
    #webgl-container,
    #css3d-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    #css3d-container {
      z-index: 1;
    }
    
    /* Loading screen */
    #loadingOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.5s;
    }
    
    #loadingOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .loading-text {
      font-size: 48px;
      color: #fff;
      letter-spacing: 0.2em;
      margin-bottom: 40px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .loading-status {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 30px;
      text-align: center;
      line-height: 1.6;
    }
    
    .loading-status.error {
      color: #ff4444;
    }
    
    /* Calibration buttons */
    .calibration-buttons {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .calibration-buttons.show {
      opacity: 1;
    }
    
    .calibration-btn {
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 15px 30px;
      font-size: 16px;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s;
      min-width: 200px;
    }
    
    .calibration-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.8);
      transform: translateY(-2px);
    }
    
    .calibration-btn:active {
      transform: translateY(0);
    }
    
    .calibration-btn.primary {
      border-color: #00ff00;
      color: #00ff00;
    }
    
    .calibration-btn.primary:hover {
      background: rgba(0, 255, 0, 0.1);
      border-color: #00ff00;
    }
    
    .calibration-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    /* Code editor - transparent overlay, resizable from top */
    #code-editor {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.1);
      border: none;
      color: #0f0;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      padding: 10px;
      z-index: 100;
      resize: vertical;
      overflow: auto;
      pointer-events: auto;
      white-space: nowrap;
      word-wrap: normal;
      overflow-wrap: normal;
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loadingOverlay">
    <div class="loading-text">TELL-A-VISION</div>
    <div class="loading-status" id="loadingStatus">Connecting to server...</div>
    
    <!-- Calibration buttons (shown when server asks for choice) -->
    <div class="calibration-buttons" id="calibrationButtons">
      <button class="calibration-btn primary" id="useLast">
        Use Last Settings
        <br><small>Quick start</small>
      </button>
      <button class="calibration-btn" id="calibrateNow">
        Calibrate Now
        <br><small>Adjust camera & balls</small>
      </button>
    </div>
  </div>
  
  <!-- 3D rendering containers -->
  <div id="webgl-container"></div>
  <div id="css3d-container"></div>
  
  <!-- Code editor -->
  <textarea id="code-editor" spellcheck="false">
{
  clips: {
    A: {url: "reds_nightmare.mp4", start: 6, end: 12},
    B: {url: "hackers.png", start: 0, end: 6},
  },

  presets: {
    spinning: {
      rotation: "sin(time*10)*10",     // Rotates back and forth
      scale: 10
    },
    pulsing: {
      scale: "5 + 3*sin(time*2)",      // Pulses between 2 and 8
      rotation: 0
    },
    growing: {
      scale: "5 + time*0.5",           // Grows from 5 upward
      rotation: "time*20"              // Also spins steadily
    },
    static: {
      scale: 10,                       // Just a number - no animation
      rotation: 0
    }
  },
  
  streams: {
    streamA: "A{spinning} B{pulsing}",
    streamB: "B{growing} A{static}",
  },
  
  routing: {
    ball_0: {stream: "streamA", offset: 0},
    ball_1: {stream: "streamB", offset: 0}
  },
  
  showCamera: true
}
  </textarea>
  
  <!-- Import modular JavaScript -->
  <script type="module" src="./core/main.js"></script>
</body>
</html>
